[package]
name = "zetl"
version = "0.8.1"
edition = "2021"
description = "Bi-directional wikilink graph CLI for knowledge management, solo or team"
license = "AGPL-3.0-or-later"
repository = "https://codeberg.org/anuna/zetl"
homepage = "https://codeberg.org/anuna/zetl"
readme = "README.md"

# Workspace declaration exists so repo-local tools (`zetl-ast-reference-gen`
# for REQ-3202 and `xtask` for CON-3212's `update-golden` command) can run
# via `cargo run -p <tool>` / `cargo xtask` from the repo root.
# diamond-types-spike is an IMPL-029 phase-0 spike that pins its own deps
# and must stay standalone.
[workspace]
members = ["tools/zetl-ast-reference-gen", "tools/xtask", "mobile"]
exclude = ["tools/diamond-types-spike"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
default = ["content-components", "component-islands"]
reason = ["dep:spindle-core", "dep:spindle-parser"]
# SPEC-049 content-author components & directives. Gates the directive
# recogniser, the isolated body sanitiser, untrusted prop recognition, and
# the CON-4904 static HTML-context lint. The lint parses templates via
# minijinja's `unstable_machinery` API (no semver guarantee — NFR-4903(d)
# requires it be reachable ONLY through this feature, alongside the exact
# minijinja version pin below). On by default; turning it off compiles the
# pre-SPEC-049 behaviour (`:::name` stays literal text).
content-components = ["minijinja/unstable_machinery"]
# SPEC-050 component islands & inter-island messaging. Gates island manifest
# fields, topic/type grammars, static wiring verification, CSP computation,
# island asset emission, and the window.zetl bus runtime. On by default;
# off compiles the pre-SPEC-050 behaviour (no bus, no island scripts).
component-islands = []
history = ["dep:jj-lib", "dep:chrono", "dep:pollster"]
semantic = ["dep:ort", "dep:tokenizers", "dep:ureq"]
mcp = ["dep:rmcp"]
# Historical marker from the IMPL-029 automerge → diamond-types swap.
# Diamond-types is now an unconditional dependency, so this feature is a
# no-op; preserved so `cargo test --features collab` keeps working for
# callers and CI that still pass the flag.
collab = []
# SPEC-041 ADR-4105: opt-in OIDC method. Additive on top of `collab`. The
# deps below only enter the build graph under this feature — NFR-4102
# isolation. We use `jsonwebtoken` for ID-token signature/claims validation
# and `reqwest` for the (async) discovery + JWKS + token-endpoint round
# trips. Rolling the protocol logic by hand on these primitives keeps the
# dependency surface auditable (vs the heavier `openidconnect` crate).
collab-oidc = ["dep:jsonwebtoken", "dep:reqwest"]
# Pulls in the `keyring` crate so the SPEC-040 mobile KeyStore can
# persist the SSH key in the platform keychain on macOS / Windows /
# Linux desktop. iOS and Android fall back to the file path until
# Tauri-plugin-side keychain glue lands. Off by default — only the
# mobile feature activates it.
keyring-storage = ["dep:keyring"]
# SPEC-040 REQ-4004 / REQ-4005: enables the `/_mobile/*` route surface
# (onboarding, capture, sync) consumed by the Tauri Mobile shell when
# zetl serve is embedded as the mobile UI host. Off by default — desktop
# serve never registers these routes.
#
# Activates `ssh` (BIP39-derived ed25519 key auth — REQ-4003) and
# `https` (anonymous public-repo clones for users who don't want to
# set up SSH keys; private HTTPS via PAT is a follow-up) features on
# git2 so the mobile_git module's clone / pull / push paths can reach
# both kinds of git remote. Also activates `keyring-storage` so the
# KeyStore prefers the OS keychain over the JSON file when available.
mobile = ["git2/ssh", "git2/https", "keyring-storage", "vendored-openssl"]
# SPEC-033 per-ecosystem feature flags (REQ-3301, NFR-3304). Each flag
# gates one ecosystem's adapter + translator code at compile time so a
# minimal zetl build can drop whole ecosystems. `src/ecosystems/` holds
# the shared registry + trait scaffolding unconditionally so
# `zetl ecosystem check` can list every ecosystem's id and installation
# hint even on a stripped binary (REQ-3313).
#
# The `ecosystems-v1` umbrella that previously enabled all three at
# once was retired in Phase F (SPEC-033 §12) after two clean releases
# of all three adapters. Users who want the full ecosystem set now
# pass `--features ecosystem-pandoc,ecosystem-mdbook,ecosystem-remark`
# explicitly (they are on by default in the release binaries).
ecosystem-pandoc = []
ecosystem-mdbook = []
ecosystem-remark = []
# Vendor and statically link OpenSSL into the binary instead of linking
# against the system libssl. Enable this on cross-compile / static-binary
# release builds where no target-side OpenSSL sysroot is available.
# Also routes git2 HTTPS through vendored OpenSSL instead of Apple
# Secure Transport — essential for macOS cross-compile from Linux
# (osxcross doesn't ship a complete Security.framework).
vendored-openssl = ["dep:openssl"]

[dependencies]
anyhow = "1"
thiserror = "1"
tempfile = "3"
blake3 = "1"
argon2 = "0.5"  # IMPL-041 Phase 3: argon2id password hashing (SPEC-041 REQ-4107, NFR-4103)
rpassword = "7"  # IMPL-041 Phase 3: TTY-only password prompt for `zetl collab passwd` (SPEC-041 REQ-4108)
# IMPL-041 Phase 5b — collab-oidc feature deps only. These are NOT pulled
# into the default `--features collab` build (NFR-4102).
jsonwebtoken = { version = "9", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
# (sha2 is already a direct dep below; not added again here — the feature
# already-listed `dep:sha2` is unnecessary since the dep is always present.)
clap = { version = "4", features = ["derive", "suggestions", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
comfy-table = "7"
globset = "0.4"
ignore = "0.4"
petgraph = "0.7"
rayon = "1"
axum = { version = "0.8", features = ["ws"] }
pulldown-cmark = "0.12"
regex = "1"
tokio = { version = "1", features = ["full"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SPEC-049 NFR-4903(a): exact version pin (not a `^`/`~` range) while the
# `unstable_machinery` AST API — enabled via the `content-components` feature
# — is in use, because that API carries NO semver guarantee. A minijinja bump
# is a deliberate, reviewed step (re-run the AST-shape regression tests).
minijinja = { version = "=2.16.0", features = ["builtins", "loader", "urlencode"] }
include_dir = "0.7"
serde_yaml_ng = "0.10"
toml = "0.8"
quick-xml = "0.36"
spindle-core = { git = "https://codeberg.org/anuna/spindle-rust.git", optional = true, features = ["serde"] }
spindle-parser = { git = "https://codeberg.org/anuna/spindle-rust.git", optional = true }
jj-lib = { version = "0.32", optional = true }
chrono = { version = "0.4", optional = true, features = ["std"] }
pollster = { version = "0.4", optional = true }
ort = { version = "=2.0.0-rc.11", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
sha2 = "0.10"
ureq = { version = "2", optional = true }
notify = "6"
tantivy = "0.22"
webauthn-rs = "0.5"
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
# SPEC-034 REQ-3421 capability-mode HTML sanitiser. Wraps the ammonia
# Builder with an allowlist matching OWASP HTML-sanitisation recommendations;
# config lives at tools/sanitiser-config.toml for operator visibility.
ammonia = "4"
bip39 = { version = "2", features = ["rand"] }
# SPEC-034 REQ-3408 (CLI) / §8 `cap::pair::spake2` — PAKE-over-ed25519
# used by `zetl cap pair` to authenticate an out-of-band pubkey handoff
# against a freshly-generated 4-word BIP39 phrase. The 0.4 line tracks
# rand_core 0.6 + curve25519-dalek 4.x (the versions zetl already links)
# and stays within the workspace's pinned rustc floor.
spake2 = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
# SPEC-034 CON-3401 path-cap derivation + CON-3409 TOFU-wrap derivation.
# Used by the pure-core `cap::derivation` module (RFC 5869 HKDF-SHA256).
hkdf = "0.12"
getrandom = "0.2"
# SPEC-034 REQ-3422 + ADR-3413 X25519 ephemeral padding. The `zeroize`
# feature wires ZeroizeOnDrop onto StaticSecret so padding scalars are
# zeroed when the padding-construct function returns — that guarantee
# is asserted at compile time in `cap::pad` tests.
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# SPEC-034 REQ-3403 / CON-3404 age v1 ciphertext emission. `cap::age_encrypt`
# wraps `age::Encryptor::with_recipients` over standard `x25519::Recipient`
# entries so real + padding recipients are byte-indistinguishable in the
# header (REQ-3422 acceptance #3).
age = "0.11"
# bech32 encoding of raw X25519 pubkeys into the "age1..." form that
# `age::x25519::Recipient` accepts via `FromStr` (no public constructor
# from raw bytes exists in 0.11). Standard Bech32 variant (not Bech32m),
# HRP "age" — matches the age wire format.
bech32 = "0.11"
# RngCore / CryptoRng traits + OsRng; used by `cap::pad` and by any
# other pure-core-with-rng surface that needs to accept seeded RNGs for
# deterministic tests.
rand_core = { version = "0.6", features = ["getrandom"] }
# The `ZeroizeOnDrop` marker trait used by `cap::pad` to assert at
# compile time that padding private scalars are zeroed on drop
# (SPEC-034 ADR-3413). Also pulled in transitively by x25519-dalek;
# the explicit entry keeps the semantic dependency visible.
zeroize = "1"
# default-features=false disables `https` + `ssh`. zetl only uses git2
# for local repo inspection and auto-commits (no network), so neither
# is needed. Dropping `https` also eliminates libgit2-sys's
# unconditional `stransport.c` compile on macOS, which in turn
# eliminates the dependency on Security.framework — critical for
# cross-compile from Linux via osxcross (incomplete SDK).
git2 = { version = "0.19", default-features = false }
diamond-types = "1.0"
rmcp = { version = "1", optional = true, features = ["server", "transport-io", "server-side-http", "transport-streamable-http-server"] }
# Optional, only pulled in by the `vendored-openssl` feature. Its sole
# purpose is to propagate the `vendored` feature flag to the transitive
# `openssl-sys` crate (used by git2 / libgit2-sys) so static
# self-contained OpenSSL is built during cross-compile release runs.
openssl = { version = "0.10", optional = true, features = ["vendored"] }
urlencoding = "2.1.3"
# SPEC-040 KeyStore platform keychain — feature-gated via
# `keyring-storage` (which the `mobile` feature activates). On macOS
# this wraps Keychain Services; on Windows the Credential Vault; on
# Linux the Secret Service (libsecret / kwallet). iOS support
# upstream is in-progress; we fall back to ssh_key.json on platforms
# where the crate cannot operate.
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
# Response compression for zetl serve (gzip + brotli).
# Activated unconditionally on the axum stack; compression only kicks in
# when the client sends Accept-Encoding matching a supported algorithm,
# so adding this doesn't bloat binaries for non-serve commands — they
# link the code but never execute it.
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "set-header"] }
# Brotli encoder for `zetl build` to emit .br precompressed files alongside
# html/css/js/json. Static hosts (Netlify/Cloudflare/nginx) serve the .br
# variant when the client advertises `Accept-Encoding: br`.
brotli = "7"


[dev-dependencies]
assert_cmd = "2"
flate2 = "1"
# Pulled in by src/hooks/ast/ round-trip tests to validate emitted JSON
# against tools/zetl-ast-schema-v1.json (SPEC-032 REQ-3202 / TEST-3202).
jsonschema = { version = "0.26", default-features = false }
libc = "0.2"
predicates = "3"
proptest = "1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Seeded ChaCha20 RNG (CryptoRng) for deterministic-padding tests
# (SPEC-034 §8 purity: `cap::pad::x25519_padding_construct` is a
# function of its RNG input).
rand_chacha = "0.3"

# PERF-BUILD-2026-05-12 task `bench-fixture`: synthetic-vault generator
# used by the perf benchmarks. Lives under `src/bin/` so it does not
# affect any production code path; build it on demand with
# `cargo build --release --bin gen-vault`.
[[bin]]
name = "gen-vault"
path = "src/bin/gen-vault.rs"

[[test]]
name = "reason_integration"
required-features = ["reason"]

[[test]]
name = "vcs_independence"
required-features = ["reason"]

[[test]]
name = "spl_projection_integration"
required-features = ["reason"]

[[test]]
name = "history_integration"
required-features = ["history"]

[[test]]
name = "semantic_integration"
required-features = ["semantic"]

[[test]]
name = "mcp_integration"
required-features = ["mcp"]

[[test]]
name = "pandoc_adapter_integration"
required-features = ["ecosystem-pandoc"]

[[test]]
name = "mdbook_adapter_integration"
required-features = ["ecosystem-mdbook"]

[[test]]
name = "remark_harness_integration"
required-features = ["ecosystem-remark"]
