[package]
name = "zetl"
version = "0.1.0"
edition = "2021"
description = "Bi-directional wikilink graph CLI for personal knowledge management"
license = "MIT"

[features]
default = []
reason = ["dep:spindle-core", "dep:spindle-parser"]
history = ["dep:jj-lib", "dep:chrono", "dep:pollster"]
semantic = ["dep:ort", "dep:tokenizers", "dep:ureq"]
mcp = ["dep:rmcp", "dep:jsonwebtoken"]

[dependencies]
anyhow = "1"
thiserror = "1"
tempfile = "3"
blake3 = "1"
clap = { version = "4", features = ["derive", "suggestions", "env"] }
comfy-table = "7"
globset = "0.4"
ignore = "0.4"
petgraph = "0.7"
axum = { version = "0.8", features = ["ws"] }
pulldown-cmark = "0.12"
regex = "1"
tokio = { version = "1", features = ["full"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", features = ["builtins", "loader", "urlencode"] }
include_dir = "0.7"
serde_yaml_ng = "0.10"
toml = "0.8"
tui-input = "0.11"
spindle-core = { git = "ssh://git@codeberg.org/anuna/spindle-rust.git", optional = true, features = ["serde"] }
spindle-parser = { git = "ssh://git@codeberg.org/anuna/spindle-rust.git", optional = true }
jj-lib = { version = "0.32", optional = true }
chrono = { version = "0.4", optional = true, features = ["std"] }
pollster = { version = "0.4", optional = true }
ort = { version = "=2.0.0-rc.11", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
sha2 = "0.10"
ureq = { version = "2", optional = true }
notify = "6"
tantivy = "0.22"
webauthn-rs = "0.5"
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
bip39 = { version = "2", features = ["rand"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
getrandom = "0.2"
git2 = "0.19"
automerge = "0.5"
rmcp = { version = "1", optional = true, features = ["server", "transport-io", "server-side-http"] }
jsonwebtoken = { version = "9", optional = true }

[dev-dependencies]
assert_cmd = "2"
libc = "0.2"
predicates = "3"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[[test]]
name = "reason_integration"
required-features = ["reason"]

[[test]]
name = "vcs_independence"
required-features = ["reason"]

[[test]]
name = "history_integration"
required-features = ["history"]

[[test]]
name = "semantic_integration"
required-features = ["semantic"]

[[test]]
name = "mcp_integration"
required-features = ["mcp"]
