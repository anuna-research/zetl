[package]
name = "zetl"
version = "0.1.0"
edition = "2021"
description = "Bi-directional wikilink graph CLI for personal knowledge management"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
globset = "0.4"
ignore = "0.4"
petgraph = "0.7"
pulldown-cmark = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
