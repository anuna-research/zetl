[package]
name = "zetl"
version = "0.1.0"
edition = "2021"
description = "Bi-directional wikilink graph CLI with defeasible reasoning for personal knowledge management"
license = "MIT"

[features]
default = []
reason = ["dep:spindle-core", "dep:spindle-parser"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
globset = "0.4"
ignore = "0.4"
petgraph = "0.7"
pulldown-cmark = "0.12"
regex = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-input = "0.11"
spindle-core = { git = "ssh://git@codeberg.org/anuna/spindle-rust.git", optional = true, features = ["serde"] }
spindle-parser = { git = "ssh://git@codeberg.org/anuna/spindle-rust.git", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
