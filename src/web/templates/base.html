<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ vault.name }} — zetl{% endblock %}</title>
  <script type="application/json" id="zetl-search-index">{{ search_index | safe }}</script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  {% block head %}{% endblock %}
  <style>
    /* dead link */
    a.link-error { color: oklch(var(--er)); text-decoration: underline wavy; }
    /* line anchors for backlink scroll targets */
    .line-anchor { scroll-margin-top: 2rem; }
    :has(> .line-anchor:target) {
      animation: line-highlight 2s ease-out;
      border-radius: 4px;
    }
    @keyframes line-highlight {
      0%   { background: oklch(var(--wa) / 0.35); }
      100% { background: transparent; }
    }

    /* page + transclusion wrapper: stacked on mobile, side-by-side on desktop */
    .page-with-panel {
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 1280px) {
      .page-with-panel { flex-direction: row; }
    }

    /* transclusion panel — mobile: inline below content */
    .transclusion-panel {
      border-top: 1px solid oklch(var(--b3));
      padding: 1rem;
      background: oklch(var(--b1));
    }
    .transclusion-panel .transclusion-card .tc-excerpt {
      display: block;
    }
    .transclusion-panel .transclusion-card {
      margin-bottom: 0.75rem;
    }
    /* transclusion panel — desktop: sticky sidebar */
    @media (min-width: 1280px) {
      .transclusion-panel {
        width: 36rem;
        flex-shrink: 0;
        border-top: none;
        border-left: 1px solid oklch(var(--b3));
        overflow-y: auto;
        position: sticky;
        top: 0;
        max-height: 100vh;
      }
      .transclusion-panel .transclusion-card .tc-excerpt {
        display: none;
      }
      .transclusion-panel .transclusion-card.tc-active .tc-excerpt {
        display: block;
      }
    }
    /* stats: horizontal scroll on small screens */
    .stats { overflow-x: auto; }
    .tp-header {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.4;
      margin-bottom: 1rem;
    }
    .transclusion-card {
      border-left: 3px solid transparent;
      padding: 0.4rem 0.75rem;
      margin-bottom: 0.25rem;
      border-radius: 0.375rem;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .transclusion-card:hover,
    .transclusion-card.tc-active {
      background: oklch(var(--b2) / 0.5);
      box-shadow: 0 0 0 1px oklch(var(--b3) / 0.4);
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.5rem;
    }
    .transclusion-card .tc-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }
    .transclusion-card .tc-title:hover {
      text-decoration: underline;
    }
    .transclusion-card .tc-excerpt {
      display: none;
      margin-top: 0.5rem;
    }
    .transclusion-card .tc-excerpt.prose {
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .transclusion-card.tc-active .tc-excerpt {
      display: block;
    }
    /* Mobile transclusion panel: stacked below content, all excerpts visible */
    @media (max-width: 1279px) {
      .transclusion-panel {
        border-top: 2px solid oklch(var(--b3));
        margin-top: 2rem;
      }
      .transclusion-panel .transclusion-card .tc-excerpt {
        display: block;
      }
    }

    /* wikilink color underline */
    a.wikilink {
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      transition: background 0.12s ease;
    }
    a.wikilink.wl-active {
      background: rgba(0,0,0,0.08);
      border-radius: 2px;
      padding: 1px 3px;
      margin: 0 -3px;
    }

    /* Mobile link-preview tooltip */
    .wikilink-tooltip {
      position: fixed;
      left: 1rem; right: 1rem;
      max-height: 60vh;
      background: oklch(var(--b1));
      border: 1px solid oklch(var(--b3));
      border-radius: 0.75rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      z-index: 50;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .wikilink-tooltip.tt-visible {
      opacity: 1;
      pointer-events: auto;
    }
    .tt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid oklch(var(--b3));
      position: sticky; top: 0;
      background: oklch(var(--b1));
      border-radius: 0.75rem 0.75rem 0 0;
    }
    .tt-header a {
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      color: oklch(var(--p));
    }
    .tt-header a:hover { text-decoration: underline; }
    .tt-close {
      background: none; border: none;
      font-size: 1.25rem; cursor: pointer;
      opacity: 0.5; padding: 0 0.25rem;
      color: oklch(var(--bc));
    }
    .tt-close:hover { opacity: 1; }
    .tt-body {
      padding: 0.75rem 1rem;
      overflow-y: auto;
      flex: 1;
    }
    .tt-body.prose { font-size: 0.85rem; line-height: 1.6; }
    .tt-footer {
      padding: 0.5rem 1rem 0.75rem;
      border-top: 1px solid oklch(var(--b3));
      text-align: right;
    }
    .tt-footer a {
      font-size: 0.8rem;
      font-weight: 500;
      color: oklch(var(--p));
      text-decoration: none;
    }
    .tt-footer a:hover { text-decoration: underline; }
    @media (min-width: 1280px) {
      .wikilink-tooltip { display: none !important; }
    }

    /* ── Search modal (Cmd+K) ─────────────────────────── */
    .search-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
    }
    .search-overlay.open { display: flex; }
    .search-dialog {
      background: oklch(var(--b1));
      border: 1px solid oklch(var(--b3));
      border-radius: 0.75rem;
      width: 90vw; max-width: 480px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .search-input {
      width: 100%; border: none; outline: none;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      background: transparent;
      color: oklch(var(--bc));
      border-bottom: 1px solid oklch(var(--b3));
    }
    .search-results {
      max-height: 40vh; overflow-y: auto;
      padding: 0.25rem 0;
    }
    .search-result {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      padding: 0.5rem 1rem;
      text-decoration: none;
      color: oklch(var(--bc));
      cursor: pointer;
    }
    .search-result:hover,
    .search-result.sr-active {
      background: oklch(var(--p) / 0.12);
    }
    .search-result .sr-name {
      font-weight: 500;
    }
    .search-result .sr-name b {
      color: oklch(var(--p));
      font-weight: 700;
    }
    .search-result .sr-slug {
      font-size: 0.75rem;
      opacity: 0.5;
    }
    .search-result .page-name {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .search-result .heading {
      font-size: 0.78rem;
      opacity: 0.6;
      font-style: italic;
    }
    .search-result .context {
      font-size: 0.78rem;
      opacity: 0.5;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .search-result .score {
      font-size: 0.7rem;
      opacity: 0.4;
      font-family: monospace;
    }
    .search-hint {
      padding: 1rem;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.5;
    }
    .search-btn {
      display: flex; align-items: center; gap: 0.5rem;
      width: 100%;
      padding: 0.4rem 0.75rem;
      border: 1px solid oklch(var(--b3));
      border-radius: 0.5rem;
      background: oklch(var(--b1));
      color: oklch(var(--bc));
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s;
      margin-bottom: 0.75rem;
    }
    .search-btn:hover { opacity: 1; }
    .search-btn kbd {
      margin-left: auto;
      font-size: 0.7rem;
      opacity: 0.5;
    }
    {% block styles %}{% endblock %}
  </style>
</head>
<body class="min-h-screen bg-base-100">

  <!-- Drawer layout for responsive sidebar -->
  <div class="drawer lg:drawer-open">
    <input id="sidebar-toggle" type="checkbox" class="drawer-toggle">

    <!-- Main content -->
    <div class="drawer-content flex flex-col">
      <!-- Top bar (mobile) -->
      <div class="navbar bg-base-200 lg:hidden">
        <label for="sidebar-toggle" class="btn btn-ghost drawer-button">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </label>
        <span class="text-lg font-bold ml-2">zetl</span>
      </div>

      {% block content %}{% endblock %}
    </div>

    <!-- Sidebar -->
    <div class="drawer-side">
      <label for="sidebar-toggle" aria-label="close sidebar" class="drawer-overlay"></label>
      <aside class="bg-base-200 w-64 min-h-screen p-4">
        <a href="/" class="text-xl font-bold mb-4 block">zetl</a>
        <div class="divider my-1"></div>
        <button class="search-btn" onclick="openSearch()">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Search…
          <kbd>⌘K</kbd>
        </button>
        {% block sidebar %}
        <ul class="menu menu-sm">
          {%- for page in vault.pages %}
          <li><a href="/{{ page.slug | safe }}" class="{% if active_slug == page.slug %}active{% endif %}">{{ page.title }}</a></li>
          {%- endfor %}
        </ul>
        {% endblock %}
      </aside>
    </div>
  </div>

  <!-- Search modal (Cmd+K) -->
  <div class="search-overlay" id="search-overlay" onclick="if(event.target===this)closeSearch()">
    <div class="search-dialog">
      <input class="search-input" id="search-input" type="text" placeholder="Search pages…" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <script>
  (function(){
    var MODE='{{ mode }}';
    var overlay=document.getElementById('search-overlay');
    var input=document.getElementById('search-input');
    var results=document.getElementById('search-results');
    var active=-1;
    var filtered=[];
    var debounceTimer=null;

    var pageList=(function(){
      try{return JSON.parse(document.getElementById('zetl-search-index').textContent||'[]');}
      catch(e){return [];}
    })();

    function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function slugFromPath(path){return path.replace(/\.[^/.]+$/,'').toLowerCase().replace(/ /g,'-');}

    function fastFilter(q){
      var ql=q.toLowerCase();
      return pageList
        .filter(function(p){return p.n.toLowerCase().indexOf(ql)>=0;})
        .slice(0,10)
        .map(function(p){return {page:p.n,slug:p.s,score:0};});
    }

    /* ── Render result items ───────────────────────────────────── */
    function render(items){
      results.innerHTML='';
      if(!input.value){
        results.innerHTML='<div class="search-hint">Type to search pages\u2026</div>';
        active=-1;
        return;
      }
      if(items.length===0){
        results.innerHTML='<div class="search-hint">No results</div>';
        active=-1;
        return;
      }
      active=0;
      items.forEach(function(item,i){
        var a=document.createElement('a');
        a.className='search-result'+(i===0?' sr-active':'');
        a.href='/'+item.slug+(item.line?'#line-'+item.line:'');
        var html='<span class="page-name">'+esc(item.page)+'</span>';
        if(item.heading)html+='<span class="heading">'+esc(item.heading)+'</span>';
        if(item.context)html+='<span class="context">'+esc(item.context)+'</span>';
        if(item.score)html+='<span class="score">'+item.score.toFixed(2)+'</span>';
        a.innerHTML=html;
        a.addEventListener('mouseenter',function(){active=i;updateActive();});
        results.appendChild(a);
      });
    }

    function showLoading(){
      results.innerHTML='<div class="search-hint">Searching\u2026</div>';
    }

    function updateActive(){
      var els=results.querySelectorAll('.search-result');
      els.forEach(function(el,i){
        el.classList.toggle('sr-active',i===active);
      });
      if(active>=0&&els[active])els[active].scrollIntoView({block:'nearest'});
    }

    /* ── BM25 scorer for build mode (client-side) ──────────────── */
    var searchIndex=null;
    function bm25Search(q,index){
      var k1=1.2,b=0.75;
      var terms=q.toLowerCase().split(/\W+/).filter(Boolean);
      var n=index.docs.length;
      var avgDl=index.avgDl||1;
      var scores={};
      terms.forEach(function(term){
        var df=index.df[term]||0;
        if(df===0)return;
        var idf=Math.log((n-df+0.5)/(df+0.5)+1);
        index.docs.forEach(function(doc,i){
          var tf=doc.tf[term]||0;
          if(tf===0)return;
          var norm=1-b+b*(doc.dl/avgDl);
          var sc=idf*(tf*(k1+1))/(tf+k1*norm);
          scores[i]=(scores[i]||0)+sc;
        });
      });
      return Object.keys(scores).map(function(i){
        var doc=index.docs[parseInt(i)];
        return {page:doc.n,slug:doc.s,score:scores[i]};
      }).sort(function(a,b){return b.score-a.score;});
    }

    /* ── Serve mode: /api/search (Tantivy full-text) ───────────── */
    var currentCtrl=null;
    function serveSearch(q){
      if(q.length<=2){filtered=fastFilter(q);render(filtered);return;}
      showLoading();
      if(currentCtrl){currentCtrl.abort();}
      currentCtrl=new AbortController();
      fetch('/api/search?q='+encodeURIComponent(q)+'&limit=20',{signal:currentCtrl.signal})
        .then(function(r){return r.ok?r.json():Promise.reject(r.status);})
        .then(function(data){
          currentCtrl=null;
          filtered=(data.results||[]).map(function(m){
            return {
              page:m.page,
              slug:slugFromPath(m.path),
              heading:m.heading||null,
              context:m.context||null,
              score:m.score,
              line:m.line||0
            };
          });
          render(filtered);
        })
        .catch(function(err){
          currentCtrl=null;
          if(err&&err.name==='AbortError')return;
          filtered=fastFilter(q);
          render(filtered);
        });
    }

    /* ── Build mode: client-side BM25 via /search-index.json ───── */
    function buildSearch(q){
      if(q.length<=2||!searchIndex){filtered=fastFilter(q);render(filtered);return;}
      filtered=bm25Search(q,searchIndex).slice(0,20);
      render(filtered);
    }

    function runSearch(){
      var q=input.value;
      if(!q){filtered=[];render([]);return;}
      if(MODE==='serve') serveSearch(q);
      else buildSearch(q);
    }

    /* ── Open / close ──────────────────────────────────────────── */
    window.openSearch=function(){
      overlay.classList.add('open');
      input.value='';active=-1;filtered=[];render([]);input.focus();
      if(MODE==='build'&&!searchIndex){
        fetch('/search-index.json')
          .then(function(r){return r.json();})
          .then(function(data){searchIndex=data;if(input.value)runSearch();})
          .catch(function(){});
      }
    };
    window.closeSearch=function(){
      overlay.classList.remove('open');
      if(currentCtrl){currentCtrl.abort();currentCtrl=null;}
    };

    /* ── Input / keyboard ──────────────────────────────────────── */
    input.addEventListener('keyup',function(e){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key==='Escape')return;
      clearTimeout(debounceTimer);
      debounceTimer=setTimeout(runSearch,150);
    });

    document.addEventListener('keydown',function(e){
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){
        e.preventDefault();
        if(overlay.classList.contains('open'))closeSearch();
        else openSearch();
        return;
      }
      if(!overlay.classList.contains('open'))return;
      if(e.key==='Escape'){closeSearch();return;}
      if(e.key==='ArrowDown'){
        e.preventDefault();
        if(active<filtered.length-1)active++;
        updateActive();
      }else if(e.key==='ArrowUp'){
        e.preventDefault();
        if(active>0)active--;
        updateActive();
      }else if(e.key==='Enter'){
        e.preventDefault();
        if(active>=0&&active<filtered.length){
          var s=filtered[active];
          window.location.href='/'+s.slug+(s.line?'#line-'+s.line:'');
        }
      }
    });
  })();
  </script>
  {% block scripts %}{% endblock %}

</body>
</html>
