when:
  - event: tag
    branch: main

steps:
  - name: build-linux
    image: rust:1-bookworm
    commands:
      - cargo build --release --features "reason,history,mcp" --target x86_64-unknown-linux-gnu
      - mkdir -p dist
      - cp target/x86_64-unknown-linux-gnu/release/ztl dist/ztl
      - cd dist && tar czf ztl-linux-x86_64.tar.gz ztl && rm ztl && cd ..

  - name: build-linux-arm64
    image: rust:1-bookworm
    commands:
      # Enable arm64 multiarch so we can install aarch64 system libraries
      # (libssl-dev:arm64) alongside the cross-compiler toolchain. Required
      # by openssl-sys (transitive via git2/libgit2-sys) which refuses to
      # cross-compile without a target sysroot.
      - dpkg --add-architecture arm64
      - apt-get update
      - apt-get install -y gcc-aarch64-linux-gnu pkg-config libssl-dev:arm64
      - rustup target add aarch64-unknown-linux-gnu
      - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
      # Point pkg-config at the arm64 multiarch lib dir and tell it to
      # tolerate cross queries (host==x86_64, target==aarch64).
      - export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
      - export PKG_CONFIG_ALLOW_CROSS=1
      - cargo build --release --features "reason,history,mcp" --target aarch64-unknown-linux-gnu
      - mkdir -p dist
      - cp target/aarch64-unknown-linux-gnu/release/ztl dist/ztl
      - cd dist && tar czf ztl-linux-arm64.tar.gz ztl && rm ztl && cd ..

  - name: build-macos-arm64
    image: rust:1-bookworm
    commands:
      - apt-get update && apt-get install -y clang cmake libxml2-dev libssl-dev lzma-dev libbz2-dev
      - rustup target add aarch64-apple-darwin
      - |
        [ -d /tmp/osxcross ] || git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
        cd /tmp/osxcross
        curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz -o tarballs/MacOSX14.5.sdk.tar.xz
        UNATTENDED=1 ./build.sh
        export PATH="/tmp/osxcross/target/bin:$PATH"
        export CC_aarch64_apple_darwin=aarch64-apple-darwin23.5-clang
        export CXX_aarch64_apple_darwin=aarch64-apple-darwin23.5-clang++
        export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=aarch64-apple-darwin23.5-clang
        cd -
        cargo build --release --features "reason,history,mcp,vendored-openssl" --target aarch64-apple-darwin
        mkdir -p dist
        cp target/aarch64-apple-darwin/release/ztl dist/ztl
        cd dist && tar czf ztl-macos-arm64.tar.gz ztl && rm ztl && cd ..

  - name: build-macos-x86_64
    image: rust:1-bookworm
    commands:
      - apt-get update && apt-get install -y clang cmake libxml2-dev libssl-dev lzma-dev libbz2-dev
      - rustup target add x86_64-apple-darwin
      - |
        [ -d /tmp/osxcross ] || git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
        cd /tmp/osxcross
        curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz -o tarballs/MacOSX14.5.sdk.tar.xz
        UNATTENDED=1 ./build.sh
        export PATH="/tmp/osxcross/target/bin:$PATH"
        export CC_x86_64_apple_darwin=x86_64-apple-darwin23.5-clang
        export CXX_x86_64_apple_darwin=x86_64-apple-darwin23.5-clang++
        export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=x86_64-apple-darwin23.5-clang
        cd -
        cargo build --release --features "reason,history,mcp,vendored-openssl" --target x86_64-apple-darwin
        mkdir -p dist
        cp target/x86_64-apple-darwin/release/ztl dist/ztl
        cd dist && tar czf ztl-macos-x86_64.tar.gz ztl && rm ztl && cd ..

  - name: build-windows
    image: rust:1-bookworm
    commands:
      - apt-get update && apt-get install -y gcc-mingw-w64-x86-64 zip
      - rustup target add x86_64-pc-windows-gnu
      # Soften LTO just for the mingw cross-link — fat LTO + codegen-units=1
      # OOMs the shared CI runner at link time (see pipelines #158/#159).
      - CARGO_PROFILE_RELEASE_LTO=thin CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 cargo build --release --features "reason,history,mcp,vendored-openssl" --target x86_64-pc-windows-gnu
      - mkdir -p dist
      - cp target/x86_64-pc-windows-gnu/release/ztl.exe dist/ztl.exe
      - cd dist && zip ztl-windows-x86_64.zip ztl.exe && rm ztl.exe && cd ..

  - name: create-metadata
    image: alpine:3
    commands:
      - apk add --no-cache jq coreutils
      - |
        cat > dist/version.json << EOF
        {
          "version": "${CI_COMMIT_TAG#v}",
          "download_url": "https://files.anuna.io/ztl/${CI_COMMIT_TAG}",
          "features": "reason,history,mcp"
        }
        EOF
      - cp install.sh dist/install.sh
      - cd dist && sha256sum ztl-*.tar.gz ztl-*.zip > SHA256SUMS && cd ..
      - ls -la dist/

  - name: upload-to-cloudflare-r2
    image: amazon/aws-cli:2.15.0
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: cf_r2_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: cf_r2_secret_access_key
      CF_ACCOUNT_ID:
        from_secret: cf_account_id
    commands:
      - export AWS_DEFAULT_REGION=auto
      - export R2_ENDPOINT="https://$${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - export BUCKET="anuna-files"
      - export PROJECT="ztl"

      # Upload versioned release
      - echo "Uploading to $${PROJECT}/$${CI_COMMIT_TAG}/..."
      - |
        for file in dist/ztl-*.tar.gz dist/ztl-*.zip dist/version.json dist/install.sh dist/SHA256SUMS; do
          if [ -f "$$file" ]; then
            filename=$$(basename "$$file")
            aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/$${CI_COMMIT_TAG}/$$filename" \
              --endpoint-url "$$R2_ENDPOINT"
            echo "Uploaded: $$filename"
          fi
        done

      # Upload to latest/
      - echo "Uploading to $${PROJECT}/latest/..."
      - |
        for file in dist/ztl-*.tar.gz dist/ztl-*.zip dist/version.json dist/install.sh dist/SHA256SUMS; do
          if [ -f "$$file" ]; then
            filename=$$(basename "$$file")
            aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/latest/$$filename" \
              --endpoint-url "$$R2_ENDPOINT"
            echo "Uploaded to latest: $$filename"
          fi
        done

      # List uploaded files
      - echo "Files in $${PROJECT}/$${CI_COMMIT_TAG}:"
      - aws s3 ls "s3://$${BUCKET}/$${PROJECT}/$${CI_COMMIT_TAG}/" --endpoint-url "$$R2_ENDPOINT"
      - echo "Files in $${PROJECT}/latest:"
      - aws s3 ls "s3://$${BUCKET}/$${PROJECT}/latest/" --endpoint-url "$$R2_ENDPOINT"
      - echo ""
      - echo "Release available at:"
      - echo "  https://files.anuna.io/$${PROJECT}/$${CI_COMMIT_TAG}/"
      - echo "  https://files.anuna.io/$${PROJECT}/latest/"
