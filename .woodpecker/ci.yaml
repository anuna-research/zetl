when:
  - event: [push, pull_request]

steps:
  - name: test
    image: rust:1-bookworm
    commands:
      - rustup component add rustfmt clippy
      # Install Node + Python for helper-js build, TEST-3210 cross-language
      # test, and the helper-contracts cross-implementation gate.
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs python3
      # SPEC-032 REQ-3210 helper-js: build ESM/CJS/types and run its own
      # test suite before the Rust-side integration test picks up dist/.
      - make helper-js-install
      - make helper-js-build
      - make helper-js-test
      # SPEC-032 REQ-3210 / CON-3210: run the fixture corpus against
      # rust + py + js helpers. `cargo test` below also picks up the
      # integration, but the dedicated invocation surfaces the diff
      # output with `--nocapture` on regression.
      - make helper-contracts
      - cargo test --verbose
      - cargo fmt --check
      - cargo clippy -- -D warnings
      # SPEC-032 REQ-3202: docs/zetl-ast-reference.md is generated from
      # tools/zetl-ast-schema-v1.json. A drift between the two is a CI
      # failure — --check exits nonzero on any diff.
      - cargo run -p zetl-ast-reference-gen -- --check
      # SPEC-032 CON-3212 canonical-extension golden-HTML gate. Walks
      # tests/extension-fixtures/ and fails on any fixture whose
      # rendered output drifts from expected.html after whitespace +
      # attribute-order normalisation.
      - make ext-golden
