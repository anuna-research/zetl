# ztl ecosystem compatibility matrix (SPEC-033 REQ-3311).
#
# Each [ecosystem.<id>] section corresponds to a registered ecosystem in
# src/ecosystems/registry.rs. Plugin rows under each section (tiered
# `supported` / `partial` / `experimental`) are seeded by the per-
# ecosystem matrix-seed tasks (task-pandoc-matrix-seed,
# task-mdbook-matrix-seed, task-remark-matrix-seed) and the full
# ecosystem × plugin × tier × fixture × contract matrix lands with
# task-eco-matrix.
#
# Contract for this file:
# - Every ecosystem id registered in src/ecosystems/registry.rs SHALL
#   appear exactly once as an [ecosystem.<id>] section here. The
#   matrix-lint gate in tests/ecosystems_registry_integration.rs
#   enforces both directions: registry-without-matrix-entry and
#   matrix-entry-without-registry both fail the build.
# - Additions to either side without a paired update in the other side
#   are rejected by the same gate.

[ecosystem.pandoc]
# Pandoc filters — SPEC-033 REQ-3303. Matrix rows seeded by
# task-pandoc-matrix-seed (pandoc-crossref, pandoc-citeproc, pantable).
#
# All three rows land at tier = "experimental" per the REQ-3311 tier-
# promotion checklist: each has `version_range`, maintainer contact,
# upstream repo URL, a named fixture under tests/ecosystem-fixtures/,
# and a `notes` field enumerating known limitations. Promotion to
# `partial` requires wiring the fixtures into a green golden-HTML
# runner; promotion to `supported` additionally requires declaring a
# `[plugin.contract]` sub-table (preserves + idempotent) and CI
# double-run evidence per TEST-3224-idempotent.

[[ecosystem.pandoc.plugins]]
name = "pandoc-crossref"
version_range = ">=0.3.14 <0.4"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/pandoc/pandoc-crossref/"
repo = "https://github.com/lierdakil/pandoc-crossref"
maintainer = "Nikolay Yakimov <root@livid.pp.ru>"
notes = """
Adds numbered cross-references for figures, equations, and tables. \
Known limitations at experimental tier: \
(a) pandoc-types major version must match the user's pandoc binary \
(crossref 0.3.14+ tracks pandoc 3.x / pandoc-types 1.23.x); mismatches \
surface via REQ-3314 version-drift detection. \
(b) Round-trip preservation of ztl Wikilink/Embed/SPL markers is \
inferred from CON-3221 defaults but not yet verified by a live \
golden-HTML run — promotion to `partial` blocks on that. \
(c) Expansion ratio is not bounded in v1; crossref may inject caption \
spans that inflate node counts beyond the default REQ-3224 advisory."""

[[ecosystem.pandoc.plugins]]
name = "pandoc-citeproc"
version_range = ">=0.17 <0.18"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/pandoc/pandoc-citeproc/"
repo = "https://github.com/jgm/pandoc-citeproc"
maintainer = "John MacFarlane <jgm@berkeley.edu>"
notes = """
Legacy external filter for citation processing. Upstream was archived \
in 2022 in favour of pandoc's built-in `--citeproc` flag, which ztl \
exposes via the adapter's native-mode resolution path (SPEC-033 \
ADR-3302 / task-pandoc-adapter). This entry is retained for users on \
pandoc <2.11 or with a legacy Makefile pipeline; new deployments \
SHOULD declare `citeproc = true` in their pandoc manifest rather than \
running this filter. Tier is capped at `experimental` for the \
lifetime of v1 — promotion is not planned."""

[[ecosystem.pandoc.plugins]]
name = "pantable"
version_range = ">=0.16 <0.17"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/pandoc/pantable/"
repo = "https://github.com/ickc/pantable"
maintainer = "Kolen Cheung <christian.kolen@gmail.com>"
notes = """
CSV / dataframe → pandoc Table filter. Known limitations at \
experimental tier: \
(a) Shipped as a Python filter; the adapter invokes it via `python3 \
-m pantable` — runtime probe at REQ-3313 checks for the Python \
module, not a standalone binary. \
(b) Tables produced may carry `colspecs` with non-default alignment \
that round-trip through ztl-ext as plain Table nodes; alignment \
fidelity is best-effort and not gated. \
(c) Promotion to `partial` blocks on a golden-HTML fixture that \
confirms CSV-cell content survives the translate → filter → \
translate-back cycle without markup corruption."""

[ecosystem.mdbook]
# mdBook preprocessors — SPEC-033 REQ-3304. Matrix rows seeded by
# task-mdbook-matrix-seed (mdbook-mermaid, mdbook-toc, mdbook-katex,
# mdbook-admonish).
#
# All four rows land at tier = "experimental" per the REQ-3311 tier-
# promotion checklist: each has `version_range`, maintainer contact,
# upstream repo URL, a named fixture under tests/ecosystem-fixtures/,
# and a `notes` field enumerating known limitations. Promotion to
# `partial` requires wiring the fixtures into a green golden-HTML
# runner that actually invokes `mdbook build` with the preprocessor
# enabled (blocked on task-eco-matrix); promotion to `supported`
# additionally requires declaring a `[plugin.contract]` sub-table
# (preserves + idempotent) and CI double-run evidence per
# TEST-3224-idempotent. The mdbook-admonish row doubles as the
# upstream backing for the SPEC-032 Callouts canonical extension per
# §13 Q1 resolution (see docs/canonical-extensions.md §Admonition).

[[ecosystem.mdbook.plugins]]
name = "mdbook-mermaid"
version_range = ">=0.14 <0.16"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/mdbook/mdbook-mermaid/"
repo = "https://github.com/badboy/mdbook-mermaid"
maintainer = "Jan-Erik Rediger <janerik@fnordig.de>"
notes = """
Rewrites ```mermaid fenced code blocks into `<pre class=\"mermaid\">` \
shells and injects the mermaid.js runtime + book-init CSS/JS assets \
via the HTML renderer. Known limitations at experimental tier: \
(a) Rendering is client-side — the preprocessor only swaps the fence; \
the actual SVG is produced by mermaid.js in the browser at page load, \
so the golden-HTML gate can only assert the shell, not the diagram. \
(b) The asset-injection path relies on mdbook's `renderer = [\"html\"]` \
output backend; users running an alternative renderer (epub, linkcheck) \
will see the shell markup but no runtime, which is cosmetically broken \
by design — the adapter surfaces this via `mdbook-mermaid install` \
guidance at probe time. \
(c) Round-trip preservation of ztl Wikilink/Embed/SplBlock markers \
inside a mermaid fence is undefined — the preprocessor treats fence \
bodies opaquely and ztl's SplBlock classifier fires first on \
```spl, so collisions are unlikely but untested."""

[[ecosystem.mdbook.plugins]]
name = "mdbook-toc"
version_range = ">=0.14 <0.15"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/mdbook/mdbook-toc/"
repo = "https://github.com/badboy/mdbook-toc"
maintainer = "Jan-Erik Rediger <janerik@fnordig.de>"
notes = """
Replaces the literal `<!-- toc -->` marker (or a configurable \
alternate) with a generated `<ul>` list of in-chapter headings. \
Known limitations at experimental tier: \
(a) The marker is HTML-comment-based; ztl's frontmatter stripper \
runs first and the marker survives unmolested, but a user who wraps \
the marker inside a fenced code block will see it preserved literally \
— expected behaviour per upstream. \
(b) Heading-depth range is configurable via `[preprocessor.toc]` in \
book.toml (defaults `max-level = 4`); the canary fixture exercises \
only depths 1–2 to stay terse and version-stable. \
(c) Anchor slugs are computed by mdbook's own GitHub-style slugifier, \
not ztl's; a page carrying an Obsidian `^block-id` that mirrors an \
mdbook-generated anchor will collide silently. Promotion to \
`partial` requires a fixture exercising unicode heading slugs."""

[[ecosystem.mdbook.plugins]]
name = "mdbook-katex"
version_range = ">=0.9 <0.10"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/mdbook/mdbook-katex/"
repo = "https://github.com/lzanini/mdbook-katex"
maintainer = "Luca Zanini <luca.zanini@outlook.com>"
notes = """
Server-side renders `$...$` inline and `$$...$$` display math into \
pre-rendered KaTeX HTML at preprocess time, avoiding a client-side \
JS runtime. Known limitations at experimental tier: \
(a) The KaTeX output embeds both a `<math>` MathML subtree and an \
HTML-span fallback subtree inside a wrapping `<span class=\"katex\">`; \
byte-stable golden-HTML comparison is brittle across KaTeX versions, \
so the canary fixture records the expected wrapper shape only and \
the full tree will land as an opt-in comparison mode under \
task-eco-matrix. \
(b) Users pairing this with the `smart_punctuation` book.toml option \
will see stray curly-quote rewrites inside math delimiters; the \
canary fixture deliberately avoids strings that would trigger it. \
(c) Dollar-escape handling (`\\$`) is inherited from the upstream \
tokenizer; escaped dollars adjacent to a literal `$...$` span have \
occasionally regressed upstream (see lzanini/mdbook-katex#117) and \
the fixture avoids that corner."""

[[ecosystem.mdbook.plugins]]
name = "mdbook-admonish"
version_range = ">=1.18 <2"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/mdbook/mdbook-admonish/"
repo = "https://github.com/tommilligan/mdbook-admonish"
maintainer = "Tom Milligan <code@tommilligan.net>"
notes = """
Rewrites ```admonish fenced blocks (including the `admonish note`, \
`admonish warning`, … flavoured opening lines) into \
`<div class=\"admonition admonish admonish-<type>\">` wrappers with \
a title div and body div. Designated as the default upstream backing \
for the SPEC-032 Callouts canonical extension per §13 Q1 resolution \
— the in-repo stub at tests/extension-fixtures/admonition/ defines \
the shared contract and this matrix row points at the real plugin \
mdBook-backed builds would wire up. Known limitations at \
experimental tier: \
(a) Class shape differs from the SPEC-032 Callouts canonical \
(`<div class=\"admonition <type>\">`) — mdbook-admonish adds the \
`admonish admonish-<type>` classes alongside. The canonical CSS \
targets `.admonition.<type>` which matches both shapes; downstream \
theme overrides referencing the `.admonish-<type>` class will break \
if the user swaps to the pandoc-admonition or Python-Markdown backing, \
so themes SHOULD target only the shared shape. \
(b) Title handling: Obsidian's `title:` header key vs mdbook-admonish's \
`[title]` bracket syntax. The CON-3212 selector accepts the Obsidian \
form and emits the shared output; this matrix row's fixture \
exercises the upstream `[title]` form so the golden-HTML runner can \
round-trip what the real binary produces. \
(c) Collapsible admonitions (`admonish collapsible.open note`) and \
custom anchor ids are a v1.x upstream feature not yet wired into the \
canonical extension contract — promotion to `partial` requires a \
decision on whether to surface those via Callouts frontmatter keys \
or leave them plugin-specific."""

[ecosystem.remark]
# remark plugins — SPEC-033 REQ-3305. Matrix rows seeded by
# task-remark-matrix-seed (remark-gfm, remark-math, remark-directive).
#
# All three rows land at tier = "experimental" per the REQ-3311 tier-
# promotion checklist: each has `version_range`, maintainer contact,
# upstream repo URL, a named fixture under tests/ecosystem-fixtures/,
# and a `notes` field enumerating known limitations. Promotion to
# `partial` requires wiring the fixtures into a green golden-HTML
# runner driven by the task-remark-harness persistent Node subprocess
# (CON-3305); promotion to `supported` additionally requires a
# `[plugin.contract]` sub-table (preserves + idempotent) and CI
# double-run evidence per TEST-3224-idempotent.

[[ecosystem.remark.plugins]]
name = "remark-gfm"
version_range = ">=4.0 <5"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/remark/remark-gfm/"
repo = "https://github.com/remarkjs/remark-gfm"
maintainer = "Titus Wormer <tituswormer@gmail.com>"
notes = """
Enables GitHub Flavored Markdown extensions at the remark-parse \
layer: pipe tables, task lists, strikethrough, autolink literals, \
footnotes. Known limitations at experimental tier: \
(a) Frontmatter stripping is the caller's responsibility — remark-gfm \
does not ship a frontmatter parser; ztl hands the body over after \
its own frontmatter split, and a user who feeds raw source in will \
see the YAML block echoed as a paragraph. \
(b) Task-list DOM shape drifted between remark-gfm v3 (`<li>` only) \
and v4 (`.contains-task-list` on the `<ul>` and `.task-list-item` on \
each `<li>`); the fixture targets v4. \
(c) Footnotes ordering is stable but the generated `id` attributes \
embed the heading of the page — round-tripping a ztl Wikilink that \
targets a footnoted page is best-effort and not yet gated."""

[[ecosystem.remark.plugins]]
name = "remark-math"
version_range = ">=6.0 <7"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/remark/remark-math/"
repo = "https://github.com/remarkjs/remark-math"
maintainer = "Junyoung Choi <fluke8259@gmail.com>"
notes = """
Parses `$...$` inline math and `$$...$$` display math into dedicated \
mdast `inlineMath`/`math` nodes which remark-rehype then serialises \
as `<code class=\"language-math math-inline\">` / `<pre><code \
class=\"language-math math-display\">…</code></pre>`. Known \
limitations at experimental tier: \
(a) Actual glyph rendering requires a companion `rehype-katex` or \
`rehype-mathjax` stage — remark-math itself is purely a parser. \
Users pairing ztl with KaTeX also need to serve the KaTeX CSS from \
the theme. \
(b) Upstream was last released 2023-09-19 and the scan classifies it \
as \"abandoned\"; it still works under unified v11 but promotion \
above `experimental` is blocked on either a fresh upstream release \
or a ztl-side fork decision. \
(c) Dollar-sign escape handling (`\\$`) is inherited from the \
underlying micromark-extension-math and has edge cases around adjacent \
punctuation; the canary fixture deliberately avoids these."""

[[ecosystem.remark.plugins]]
name = "remark-directive"
version_range = ">=3.0 <4"
tier = "experimental"
fixture = "tests/ecosystem-fixtures/remark/remark-directive/"
repo = "https://github.com/remarkjs/remark-directive"
maintainer = "Titus Wormer <tituswormer@gmail.com>"
notes = """
Adds generic directive syntax (`:::name{attrs}` container form, \
`::name[label]{attrs}` leaf form, `:name[label]{attrs}` inline form) \
at the remark-parse layer. Known limitations at experimental tier: \
(a) remark-directive on its own emits `containerDirective` / \
`leafDirective` / `textDirective` mdast nodes that remark-rehype \
renders as empty `<div>`/`<span>` placeholders — a caller-defined \
map-to-hast transform is required for meaningful HTML. The canary \
fixture encodes the canonical `div.directive.directive-<name>` + \
inline-name-as-tag mapping the upstream docs recommend. \
(b) Authors targeting MDX/Astro sites that already consume \
directives should pair this plugin with the same hast-mapping \
transform their existing pipeline uses, not the canary's, to avoid \
class-name drift between ztl-built and MDX-built pages. \
(c) No preservation gate on user-defined directive names; if a \
directive name collides with an HTML element (`:::table`), behaviour \
depends entirely on the caller's map-to-hast transform."""
