[theme]
name = "default"
version = "0.9.0"
description = "The default zetl theme"
author = "zetl contributors"
license = "AGPL-3.0"

[theme.templates]
overrides = ["base.html", "index.html", "page.html", "folder.html"]

# Vendored client-side graph rendering libraries (see SPEC-028 REQ-110).
# Files live under static/vendor/sigma/ and are served from
# /_static/vendor/sigma/. No CDN or network fetch is required at runtime.

[vendor.sigma]
version = "3.0.2"
source = "https://registry.npmjs.org/sigma/-/sigma-3.0.2.tgz"
file = "static/vendor/sigma/sigma.min.js"
global = "Sigma"
license = "MIT"
sha256 = "be6f790da9c1856765b1c430de3b1aac50433223361870edb3097a9868218a88"

[vendor.graphology]
version = "0.26.0"
source = "https://registry.npmjs.org/graphology/-/graphology-0.26.0.tgz"
file = "static/vendor/sigma/graphology.min.js"
global = "graphology"
license = "MIT"
sha256 = "dc337efa23903f61e064c8e7e7f93a429e6855dccfc2458802b4ed30c621c087"

[vendor.graphology-layout-forceatlas2]
version = "0.10.1"
source = "https://registry.npmjs.org/graphology-layout-forceatlas2/-/graphology-layout-forceatlas2-0.10.1.tgz"
file = "static/vendor/sigma/graphology-layout-forceatlas2.min.js"
global = "graphologyLayoutForceAtlas2"
license = "MIT"
sha256 = "a0ecc21c58fa3d5ae9b164d8d12f061f64dd635d9a00388783568e46cc7fb36e"
bundled = "iife"

# SPEC-028 REQ-116: graph widget placement. One of:
#   "docked"  — fixed mini-map, bottom-right of viewport (default)
#   "tabs"    — widget shares the transclusion right rail via a two-tab header
#   "stacked" — widget sits above the transclusion panel in the right rail
# Unknown values fall back to "docked".
[graph]
placement = "docked"
