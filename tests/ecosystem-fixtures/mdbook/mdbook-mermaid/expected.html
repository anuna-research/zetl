<h1 id="mdbook-mermaid-canary"><a class="header" href="#mdbook-mermaid-canary">mdbook-mermaid canary</a></h1>
<p>Paragraph before the diagram — ensures the preprocessor leaves
surrounding prose unchanged.</p>
<pre class="mermaid">graph TD;
  Start --&gt; Decide{Ready?};
  Decide --&gt;|yes| Ship;
  Decide --&gt;|no| Iterate;
</pre>
<p>Paragraph after the diagram.</p>
